name: Build & push Docker image

# 构建 Gateway Center 镜像并推送到阿里云容器镜像服务（ACR）。
# 目标仓库：registry.cn-hangzhou.aliyuncs.com/com_zoogooo/gateway-center
# 需在仓库 Settings → Secrets 配置：
#   ACR_USERNAME  ACR 登录用户名（阿里云账号名 / RAM 用户）
#   ACR_PASSWORD  ACR 登录密码（ACR 控制台设置的固定密码）
#
# 触发：push 到 main 或打 v* tag 时构建并推送；也可手动 workflow_dispatch。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read   # 仅需 checkout；镜像推送走 docker login

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  IMAGE: com_zoogooo/gateway-center

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 阿里云 ACR 不支持 OCI attestation referrer（vnd.oci.empty.v1+json），
          # 必须关闭 provenance / sbom，否则推送会被拒绝。
          provenance: false
          sbom: false
