name: Build linux/amd64 release

# 编译 Gateway Center 的 linux/amd64 可用版本：
#   - 前端（React）→ frontend/dist
#   - 后端单二进制（CGO_ENABLED=0, GOOS=linux, GOARCH=amd64）
#   - 打包为 gateway-center-linux-amd64.tar.gz（含前端产物、migrations、deploy 配置、install.sh）
# push 到 main 时上传 Artifact；打 tag（v*）时额外发布 GitHub Release。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 仅 tag 发布 Release 时需要；纯 Artifact 上传可降为 read

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'

jobs:
  build:
    name: Build (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build backend (linux/amd64)
        run: |
          mkdir -p release/gateway-center-linux-amd64
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w" -o ../release/gateway-center-linux-amd64/gateway-center ./cmd/gateway-center

      - name: Assemble release bundle
        run: |
          cd release/gateway-center-linux-amd64
          cp -r ../../frontend/dist ./dist
          cp -r ../../backend/migrations ./migrations
          cp -r ../../deploy ./deploy
          cp ../../scripts/install.sh ./install.sh
          cp ../../README.md ./README.md
          chmod +x gateway-center install.sh
          cd ..
          tar -czf ../gateway-center-linux-amd64.tar.gz gateway-center-linux-amd64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-center-linux-amd64
          path: release/gateway-center-linux-amd64/
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gateway-center-linux-amd64.tar.gz
